# Keeps the Render free-tier API (which backs the waitlist) from sleeping.
# Render sleeps a free service after ~15 minutes without traffic, and waking
# takes 50–75 s, which is longer than the waitlist form's 15 s timeout.
#
# This repo is public, so these runs do not use private Actions minutes.
# Any HTTP response keeps Render awake. The job fails (and GitHub emails the
# repo owner) only when the API gives no response at all. A 503 from /readyz
# (Postgres or Redis down, e.g. Neon's free compute cap) is shown as a warning
# rather than a failure, to avoid an email every 5 minutes during an outage.
#
# Temporary: remove this workflow once the API runs on a paid instance.
# GitHub disables scheduled workflows after 60 days without repo activity.

name: Keep dev API awake

on:
  schedule:
    # Every 5 minutes, offset from :00 when GitHub's scheduler is busiest.
    # Scheduled runs can start late; the short interval leaves margin
    # before Render's ~15 minute idle limit.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-dev-api-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Covers the curl budget below: 3 attempts x 90 s + 2 x 10 s delays.
    timeout-minutes: 8
    env:
      READYZ_URL: ${{ vars.KEEPALIVE_URL || 'https://quickbite-dev.onrender.com/readyz' }}
    steps:
      - name: Ping API readiness
        run: |
          # A cold start can take over a minute; retry so a wake-up is not a failure.
          status=$(curl --silent --show-error \
            --output response.json \
            --max-time 90 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --write-out '%{http_code}' \
            "$READYZ_URL") || status=000
          echo "HTTP $status"
          cat response.json 2>/dev/null || true
          echo
          case "$status" in
            2??) ;;
            000) echo "::error::No response from $READYZ_URL"; exit 1 ;;
            *) echo "::warning::API is awake but not ready (HTTP $status); check Postgres/Redis" ;;
          esac
