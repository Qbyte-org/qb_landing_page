<svg viewBox="0 0 520 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frame" x1="70" y1="90" x2="430" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D1F19"/>
      <stop offset="1" stop-color="#17110F"/>
    </linearGradient>
    <linearGradient id="bikeOrange" x1="120" y1="70" x2="380" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8A2A"/>
      <stop offset="1" stop-color="#F36A00"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="100" y1="40" x2="190" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9B3D"/>
      <stop offset="1" stop-color="#E85F00"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- rear motion streaks -->
  <path d="M42 150H92" stroke="#FFD0A1" stroke-width="7" stroke-linecap="round"/>
  <path d="M26 128H66" stroke="#FFF3E8" stroke-width="5" stroke-linecap="round"/>

  <!-- wheels -->
  <g filter="url(#softShadow)">
    <circle cx="146" cy="185" r="38" fill="#FFF8F2" stroke="url(#frame)" stroke-width="12"/>
    <circle cx="146" cy="185" r="13" fill="#F36A00"/>

    <circle cx="362" cy="185" r="38" fill="#FFF8F2" stroke="url(#frame)" stroke-width="12"/>
    <circle cx="362" cy="185" r="13" fill="#115E41"/>
  </g>

  <!-- bike frame -->
  <path d="M146 185L198 144L276 144L310 124L362 185" stroke="url(#frame)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M198 144L171 110" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>
  <path d="M171 110L231 110L276 144" stroke="url(#frame)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M231 110L252 82" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>
  <path d="M252 82L297 82" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>
  <path d="M297 82L310 124" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>

  <!-- handlebar -->
  <path d="M298 81L332 69" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>
  <path d="M332 69L347 73" stroke="#FF8A2A" stroke-width="10" stroke-linecap="round"/>

  <!-- saddle -->
  <path d="M208 112H236" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>
  <path d="M206 106L225 92H252" stroke="#FF8A2A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- delivery box -->
  <g filter="url(#softShadow)">
    <path d="M118 46H202C208 46 213 51 213 57V109C213 115 208 120 202 120H118C112 120 107 115 107 109V57C107 51 112 46 118 46Z"
          fill="url(#boxGrad)" stroke="url(#frame)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M107 61H213" stroke="#F8C38C" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    <path d="M121 47L140 32H181L198 47" stroke="url(#frame)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- QuickBite app logo mark embedded in box -->
    <g transform="translate(128 51)">
      <circle cx="32" cy="32" r="27" fill="#FF6B00"/>
      <path d="M10 26H24" stroke="#FFB35C" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M7 32H20" stroke="#FFB35C" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M10 38H24" stroke="#FFB35C" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M29.5 18.5V29M34 18.5V29M29.5 29C26.9 29 24.8 26.9 24.8 24.3M34 29C34 29.8 34 39.4 33.7 43.3" stroke="#FFF7EF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M43 18.5C46 18.5 48.3 20.8 48.3 23.8C48.3 29.1 45.8 32.2 43 33.1" stroke="#FFF7EF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- rider -->
  <circle cx="248" cy="60" r="24" fill="#115E41" stroke="url(#frame)" stroke-width="10"/>
  <path d="M244 84L230 132" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>
  <path d="M244 84L270 110L302 102" stroke="url(#frame)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M270 110L284 146" stroke="#FF8A2A" stroke-width="12" stroke-linecap="round"/>
  <path d="M230 132L205 144" stroke="#FF8A2A" stroke-width="12" stroke-linecap="round"/>

  <!-- little accent -->
  <circle cx="320" cy="66" r="4" fill="#FF8A2A"/>
</svg>
