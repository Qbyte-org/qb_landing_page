<svg viewBox="0 0 520 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Color fallbacks are generated from src/app/globals.css by pnpm theme:sync. -->
  <defs>
    <linearGradient id="frame" x1="70" y1="90" x2="430" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--color-ink, #2A211D)"/>
      <stop offset="1" stop-color="var(--color-dark-ink, #1C120F)"/>
    </linearGradient>
    <linearGradient id="bikeOrange" x1="120" y1="70" x2="380" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--color-brand-light, #FF8665)"/>
      <stop offset="1" stop-color="var(--color-brand, #FF4D1D)"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="100" y1="40" x2="190" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--color-brand-light, #FF8665)"/>
      <stop offset="1" stop-color="var(--color-brand-dark, #C73C17)"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="var(--color-black, #000000)" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- rear motion streaks -->
  <path d="M42 150H92" stroke="var(--color-brand-100, #FFDED2)" stroke-width="7" stroke-linecap="round"/>
  <path d="M26 128H66" stroke="var(--color-brand-50, #FFEEE6)" stroke-width="5" stroke-linecap="round"/>

  <!-- wheels -->
  <g filter="url(#softShadow)">
    <circle cx="146" cy="185" r="38" fill="var(--color-paper, #FFFAF5)" stroke="url(#frame)" stroke-width="12"/>
    <circle cx="146" cy="185" r="13" fill="var(--color-brand, #FF4D1D)"/>
    <g stroke="var(--color-beige, #B79C8C)" stroke-width="2" opacity="0.8">
      <path d="M146 147V223M108 185H184M119 158L173 212M173 158L119 212"/>
    </g>

    <circle cx="362" cy="185" r="38" fill="var(--color-paper, #FFFAF5)" stroke="url(#frame)" stroke-width="12"/>
    <circle cx="362" cy="185" r="13" fill="var(--color-forest, #0F7A5A)"/>
    <g stroke="var(--color-beige, #B79C8C)" stroke-width="2" opacity="0.8">
      <path d="M362 147V223M324 185H400M335 158L389 212M389 158L335 212"/>
    </g>
  </g>

  <!-- bike frame -->
  <path d="M146 185L198 144L276 144L310 124L362 185" stroke="url(#frame)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M198 144L171 110" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>
  <path d="M171 110L231 110L276 144" stroke="url(#frame)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M231 110L252 82" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>
  <path d="M252 82L297 82" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>
  <path d="M297 82L310 124" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>
  <path d="M198 144L230 185H276L310 124" stroke="var(--color-brand, #FF4D1D)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="230" cy="185" r="7" fill="var(--color-paper, #FFFAF5)" stroke="url(#frame)" stroke-width="4"/>

  <!-- handlebar -->
  <path d="M298 81L332 69" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>

  <!-- saddle -->
  <path d="M208 112H236" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>

  <!-- delivery box -->
  <g filter="url(#softShadow)">
    <path d="M118 46H202C208 46 213 51 213 57V109C213 115 208 120 202 120H118C112 120 107 115 107 109V57C107 51 112 46 118 46Z"
          fill="url(#boxGrad)" stroke="url(#frame)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M107 61H213" stroke="var(--color-brand-100, #FFDED2)" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    <path d="M121 47L140 32H181L198 47" stroke="url(#frame)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M127 54H193" stroke="var(--color-brand-50, #FFEEE6)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Current QuickBite mark from public/logo-mark-light.svg -->
    <path fill="var(--color-logo-light, #FFF9DA)" transform="translate(126 48) scale(2.2)"
      d="M23.44 22.06s-.07.04-.1.06c-.02 0-.03.02-.05.03-1.01.62-3.91 1.82-10 .46-2.78-.62-4.58-.94-5.71-1.11-.2-.03-.46-.06-.46-.06l-1.04-2.91 7.26.28-.03 1.1 5.17.14.03-1.13h1.33v-1.68h-.08l-15.33-.41.92-2.39h10.94c.9 0 1.63-.73 1.63-1.63v-.27H6.62l.81-2.45s5.67-.79 7.01-.91c1.17-.1 4.62-1.19 7.97.58.27.17.63.39 1.05.65.02.02.05.03.07.05 4.26 2.71 4.22 8.94-.08 11.59Z"/>
  </g>

  <!-- rider -->
  <circle cx="248" cy="60" r="24" fill="var(--color-forest-dark, #10231C)" stroke="url(#frame)" stroke-width="10"/>
  <path d="M228 57C231 42 242 34 256 37C264 39 270 45 272 53" stroke="var(--color-brand-light, #FF8665)" stroke-width="6" stroke-linecap="round"/>
  <path d="M244 84L230 132" stroke="url(#frame)" stroke-width="12" stroke-linecap="round"/>
  <path d="M244 84L270 110L302 102" stroke="url(#frame)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M230 132L205 144" stroke="var(--color-ink, #2A211D)" stroke-width="12" stroke-linecap="round"/>

  <!-- little accent -->
  <circle cx="320" cy="66" r="4" fill="var(--color-brand-light, #FF8665)"/>
</svg>
